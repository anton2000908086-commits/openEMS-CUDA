name: Windows Online Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022 # Фиксируем версию Windows Server 2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Официальный экшен для установки CUDA напрямую с серверов NVIDIA
    - name: Install CUDA Toolkit
      uses: NVIDIA/cuda-actions/cuda-installation@v0.1.2
      with:
        cuda-version: '12.2.0'
        cuda-components: 'nvcc, cudart, cublas, cublas_dev'

    - name: Restore vcpkg
      uses: actions/cache@v4
      with:
        path: $env:VCPKG_INSTALLATION_ROOT/downloads
        key: vcpkg-downloads

    - name: Install vcpkg dependencies
      run: |
        vcpkg install boost-thread boost-date-time boost-serialization boost-chrono boost-program-options hdf5 tinyxml fparser vtk --triplet x64-windows

    - name: Configure CMake
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

    - name: Build Project
      run: |
        cmake --build build --config Release
        cmake --install build

    - name: Upload Result Artifact
      uses: actions/upload-artifact@v4
      with:
        name: openEMS-Windows-CUDA
        path: ${{ github.workspace }}/install/
