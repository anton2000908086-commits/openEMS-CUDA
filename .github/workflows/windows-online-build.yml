name: Windows Online Build 2

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA Toolkit version"
        required: false
        default: "12.2.0"
        type: string
      cuda_architectures:
        description: "CUDA architectures, e.g. 75;86;89 (RTX 20/30/40)"
        required: false
        default: "75;86;89"
        type: string
      csxcad_ref:
        description: "CSXCAD branch/tag/commit (empty = default branch)"
        required: false
        default: ""
        type: string
      fparser_ref:
        description: "fparser branch/tag/commit (empty = default branch)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  TRIPLET: x64-windows-release
  # Keep the existing binary-cache directory so previous cached packages remain reusable.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure a git tag exists
        shell: pwsh
        run: |
          git describe --tags 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { git tag v0.0.35 }
          exit 0

      # This fork asks for VTK component names from older VTK releases and
      # unconditionally includes VTK_USE_FILE. Adapt those two lines for VTK 9.
      - name: Make openEMS CMake compatible with VTK 9
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:GITHUB_WORKSPACE 'CMakeLists.txt'
          $src = Get-Content -Raw -LiteralPath $file
          $oldComponents = 'find_package(VTK COMPONENTS vtkIOXML vtkIOGeometry vtkIOLegacy vtkIOPLY NO_MODULE REQUIRED)'
          $newComponents = 'find_package(VTK COMPONENTS IOXML IOGeometry IOLegacy IOPLY NO_MODULE REQUIRED)'
          if ($src.Contains($oldComponents)) {
            $src = $src.Replace($oldComponents, $newComponents)
          } elseif (-not $src.Contains($newComponents)) {
            throw 'Could not find the expected VTK find_package line in CMakeLists.txt; review the patch for the current source.'
          }
          $oldInclude = 'include(${VTK_USE_FILE})'
          $newInclude = "if(VTK_USE_FILE)`n  include(`${VTK_USE_FILE})`nendif()"
          if ($src.Contains($oldInclude)) {
            $src = $src.Replace($oldInclude, $newInclude)
          }
          Set-Content -LiteralPath $file -Value $src -NoNewline
          Write-Host 'Prepared CMakeLists.txt for VTK 9 component names and optional VTK_USE_FILE.'

      # Prefer MSVC 14.38 for CUDA 12.2. The current hosted image may no longer
      # include this side-by-side toolset, so try the supported VS Installer CLI
      # and fall back explicitly if installation is unavailable.
      - name: Install MSVC 14.38 toolset for CUDA 12.2
        id: install_msvc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found: $vswhere" }

          $vsPath = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vsPath) { throw 'Could not find Visual Studio with the C++ x64/x86 tools.' }
          $vsPath = $vsPath.Trim()
          $toolsetsPath = Join-Path $vsPath 'VC\Tools\MSVC'
          Write-Host "Visual Studio installation: $vsPath"

          $installed = Get-ChildItem -LiteralPath $toolsetsPath -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '14.38.*' } | Select-Object -First 1
          if (-not $installed -and (Test-Path -LiteralPath $setup)) {
            $component = 'Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64'
            Write-Host "Attempting to install Visual Studio component $component using setup.exe ..."
            $installOutput = & $setup modify --installPath $vsPath --add $component --quiet --norestart 2>&1
            $installerExitCode = $LASTEXITCODE
            $installOutput | ForEach-Object { Write-Host $_ }
            Write-Host "Visual Studio Installer exit code: $installerExitCode"
            $installed = Get-ChildItem -LiteralPath $toolsetsPath -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '14.38.*' } | Select-Object -First 1
          }

          if ($installed) {
            Write-Host "Using supported MSVC toolset: $($installed.FullName)"
            Add-Content -Path $env:GITHUB_ENV -Value 'MSVC_TOOLSET_MODE=legacy'
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'mode=legacy'
          } else {
            Write-Warning 'MSVC 14.38 is not available. Falling back to the runner default compiler with nvcc --allow-unsupported-compiler. This bypasses CUDA version validation and does not guarantee a successful or correct build.'
            Add-Content -Path $env:GITHUB_ENV -Value 'MSVC_TOOLSET_MODE=fallback'
            Add-Content -Path $env:GITHUB_ENV -Value 'NVCC_PREPEND_FLAGS=--allow-unsupported-compiler'
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'mode=fallback'
          }

      - name: Set up MSVC 14.38 environment
        if: steps.install_msvc.outputs.mode == 'legacy'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
          toolset: '14.38'

      - name: Set up default MSVC environment
        if: steps.install_msvc.outputs.mode == 'fallback'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Verify selected MSVC compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clCommand = Get-Command cl.exe -ErrorAction Stop
          Write-Host "MSVC mode: $env:MSVC_TOOLSET_MODE"
          Write-Host "cl.exe: $($clCommand.Source)"
          $clText = (& cl.exe /Bv 2>&1 | Out-String)
          Write-Host $clText
          if ($env:MSVC_TOOLSET_MODE -eq 'legacy' -and $clText -notmatch 'Version\s+19\.38\.') {
            throw 'MSVC 14.38 was selected but cl.exe is not version 19.38. See compiler output above.'
          }
          if ($env:MSVC_TOOLSET_MODE -eq 'fallback') {
            Write-Warning "Using the default compiler. NVCC_PREPEND_FLAGS=$env:NVCC_PREPEND_FLAGS"
          }

      # Create the directory even if a previous step fails, so the final cache
      # save step does not fail merely because the path was never created.
      - name: Prepare vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      # A unique key allows each run to save an updated snapshot. The restore
      # prefix brings back the newest prior snapshot, including previous archives.
      - name: Restore vcpkg binary cache
        id: restore_vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          vcpkg version
          vcpkg install boost-system boost-thread boost-date-time boost-serialization boost-chrono boost-program-options hdf5 tinyxml cgal "vtk[core]" --triplet $env:TRIPLET --host-triplet $env:TRIPLET

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: ${{ inputs.cuda_version || '12.2.0' }}
          method: network

      - name: Verify CUDA and host compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          nvcc --version
          $clCommand = Get-Command cl.exe -ErrorAction Stop
          Write-Host "Using host compiler: $($clCommand.Source)"
          $clText = (& cl.exe /Bv 2>&1 | Out-String)
          Write-Host $clText
          if ($env:MSVC_TOOLSET_MODE -eq 'legacy' -and $clText -notmatch 'Version\s+19\.38\.') {
            throw 'MSVC 14.38 was selected but the active compiler is not version 19.38.'
          }
          if ($env:MSVC_TOOLSET_MODE -eq 'fallback') {
            Write-Warning 'CUDA 12.2 is being used with an unsupported host compiler. The allow-unsupported flag only bypasses nvcc version validation.'
            Write-Host "NVCC_PREPEND_FLAGS=$env:NVCC_PREPEND_FLAGS"
          }

      - name: Build fparser and CSXCAD
        shell: pwsh
        env:
          # Match the compiler environment used by the current CSXCAD Windows CI.
          # Scope these to this step to avoid unnecessarily perturbing the already-populated
          # binary-cache ABI keys in the earlier vcpkg install step.
          CC: cl
          CXX: cl
          CFLAGS: /D_WIN32_WINNT=0x0601
          CXXFLAGS: /D_WIN32_WINNT=0x0601
          FPARSER_REF: ${{ inputs.fparser_ref }}
          CSXCAD_REF: ${{ inputs.csxcad_ref }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          $deps = "$ws/deps"
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

          git clone https://github.com/thliebig/fparser.git fparser
          if ($env:FPARSER_REF) { git -C fparser checkout $env:FPARSER_REF }
          cmake -S fparser -B fparser/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON "-DCMAKE_INSTALL_PREFIX=$deps" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build fparser/build --config Release
          cmake --install fparser/build --config Release
          Write-Host 'Installed fparser files:'
          Get-ChildItem -Path "$deps/include", "$deps/lib", "$deps/bin" -ErrorAction SilentlyContinue -Recurse -File | Select-Object -ExpandProperty FullName

          git clone https://github.com/thliebig/CSXCAD.git CSXCAD
          if ($env:CSXCAD_REF) { git -C CSXCAD checkout $env:CSXCAD_REF }
          # Dependencies have already been installed by the explicit vcpkg step above.
          # Disable CSXCAD's vcpkg.json manifest auto-install so CMake uses that shared install
          # instead of rebuilding a second dependency tree under CSXCAD/build/vcpkg_installed.
          cmake -S CSXCAD -B CSXCAD/build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DVCPKG_TARGET_TRIPLET=$env:TRIPLET" "-DVCPKG_HOST_TRIPLET=$env:TRIPLET" -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_MANIFEST_INSTALL=OFF "-DCMAKE_INSTALL_PREFIX=$deps" "-DFPARSER_ROOT_DIR=$deps" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build CSXCAD/build --config Release
          cmake --install CSXCAD/build --config Release

      - name: Configure CMake
        shell: pwsh
        env:
          CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures || '75;86;89' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          $cfg = @(
            '-S', '.', '-B', 'build', '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=$env:TRIPLET",
            "-DVCPKG_HOST_TRIPLET=$env:TRIPLET",
            '-DVCPKG_MANIFEST_MODE=OFF',
            '-DVCPKG_MANIFEST_INSTALL=OFF',
            "-DCMAKE_INSTALL_PREFIX=$ws/install",
            "-DFPARSER_ROOT_DIR=$ws/deps",
            "-DCSXCAD_ROOT_DIR=$ws/deps",
            '-DWITH_CUDA=ON',
            "-DCMAKE_CUDA_ARCHITECTURES=$env:CUDA_ARCHITECTURES",
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
          )
          cmake @cfg

      - name: Build and install openEMS
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Copy runtime DLLs next to openEMS.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $bin = Join-Path $ws 'install\bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $runtimeDirs = @(
            (Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$env:TRIPLET\bin"),
            (Join-Path $ws 'deps\bin')
          )
          foreach ($dir in $runtimeDirs) {
            if (Test-Path -LiteralPath $dir) {
              Get-ChildItem -LiteralPath $dir -Filter '*.dll' -File -ErrorAction SilentlyContinue |
                Copy-Item -Destination $bin -Force
            }
          }
          # The CUDA Toolkit contains many development DLLs; the solver only
          # needs the CUDA runtime DLL to be colocated with the executable.
          $cudaBin = Join-Path $env:CUDA_PATH 'bin'
          if (Test-Path -LiteralPath $cudaBin) {
            Get-ChildItem -LiteralPath $cudaBin -Filter 'cudart64_*.dll' -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $bin -Force
          }

      # Save at the end, not immediately after the first vcpkg install: CSXCAD/openEMS
      # configuration may add more archives to the binary cache. always() preserves them
      # even if a later configure/build step fails.
      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Result Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openEMS-Windows-CUDA
          path: ${{ github.workspace }}/install/
          if-no-files-found: error
