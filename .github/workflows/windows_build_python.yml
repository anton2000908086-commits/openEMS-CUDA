name: Windows Online Build 3

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA Toolkit version"
        required: false
        default: "12.6.3"
        type: string
      cuda_architectures:
        description: "CUDA architectures, e.g. 75;86;89 (RTX 20/30/40)"
        required: false
        default: "75;86;89"
        type: string
      csxcad_ref:
        description: "CSXCAD branch/tag/commit (empty = default branch)"
        required: false
        default: ""
        type: string
      fparser_ref:
        description: "fparser branch/tag/commit (empty = default branch)"
        required: false
        default: ""
        type: string
      official_version:
        description: "Official openEMS package version used for GUI/resources only"
        required: false
        default: "v0.37.0"
        type: string

permissions:
  contents: read

env:
  TRIPLET: x64-windows-release
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure the source version tag exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git tag --list 'v0.0.35')) {
            git tag v0.0.35
          }
          git describe --tags --always

      # The current source asks for VTK component names from older releases
      # and may include VTK_USE_FILE unconditionally. Adapt it to VTK 9.
      - name: Make openEMS CMake compatible with VTK 9
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:GITHUB_WORKSPACE 'CMakeLists.txt'
          $src = Get-Content -Raw -LiteralPath $file
          $oldComponents = 'find_package(VTK COMPONENTS vtkIOXML vtkIOGeometry vtkIOLegacy vtkIOPLY NO_MODULE REQUIRED)'
          $newComponents = 'find_package(VTK COMPONENTS IOXML IOGeometry IOLegacy IOPLY NO_MODULE REQUIRED)'
          if ($src.Contains($oldComponents)) {
            $src = $src.Replace($oldComponents, $newComponents)
          } elseif (-not $src.Contains($newComponents)) {
            throw 'Could not find the expected VTK find_package line in CMakeLists.txt; review this patch for the current source.'
          }
          $oldInclude = 'include(${VTK_USE_FILE})'
          $newInclude = 'if(VTK_USE_FILE)' + [Environment]::NewLine + '  include(${VTK_USE_FILE})' + [Environment]::NewLine + 'endif()'
          if ($src.Contains($oldInclude)) {
            $src = $src.Replace($oldInclude, $newInclude)
          }
          Set-Content -LiteralPath $file -Value $src -NoNewline
          Write-Host 'Prepared root CMakeLists.txt for VTK 9.'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Set up Python 3.13 x64 for fork-matched wheels
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Prepare vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg binary cache
        id: restore_vcpkg_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          vcpkg version
          vcpkg install boost-system boost-thread boost-date-time boost-serialization boost-chrono boost-program-options hdf5 tinyxml cgal "vtk[core]" --triplet $env:TRIPLET --host-triplet $env:TRIPLET

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: ${{ inputs.cuda_version || '12.6.3' }}
          method: network

      - name: Configure nvcc for the installed MSVC
        shell: pwsh
        env:
          CUDA_VERSION: ${{ inputs.cuda_version || '12.6.3' }}
        run: |
          if ([version]$env:CUDA_VERSION -lt [version]'12.5.0') {
            Write-Warning "CUDA $env:CUDA_VERSION predates the installed MSVC; enabling compatibility overrides. Prefer CUDA 12.5+."
            Add-Content -Path $env:GITHUB_ENV -Value 'NVCC_PREPEND_FLAGS=--allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH'
          }

      - name: Add CUDA include and lib dirs for host C++ code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cuda = $env:CUDA_PATH
          if (-not $cuda) { throw 'CUDA_PATH is not set' }
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=$env:INCLUDE;$cuda\include"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$env:LIB;$cuda\lib\x64"
          if (-not (Test-Path "$cuda\include\cuda_runtime.h")) { throw 'cuda_runtime.h not found' }
          if (-not (Test-Path "$cuda\lib\x64\cudart.lib")) { throw 'cudart.lib not found' }

      - name: Verify CUDA and host compiler
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          nvcc --version
          $clCommand = Get-Command cl.exe -ErrorAction Stop
          Write-Host "Host compiler: $($clCommand.Source)"
          $clText = (& cl.exe 2>&1 | Out-String)
          Write-Host $clText
          Write-Host "NVCC_PREPEND_FLAGS=$env:NVCC_PREPEND_FLAGS"

      - name: Build fparser and CSXCAD
        shell: pwsh
        env:
          CC: cl
          CXX: cl
          CFLAGS: /D_WIN32_WINNT=0x0601
          CXXFLAGS: /D_WIN32_WINNT=0x0601
          FPARSER_REF: ${{ inputs.fparser_ref }}
          CSXCAD_REF: ${{ inputs.csxcad_ref }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          $deps = "$ws/deps"
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

          git clone https://github.com/thliebig/fparser.git fparser
          if ($env:FPARSER_REF) { git -C fparser checkout $env:FPARSER_REF }
          cmake -S fparser -B fparser/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON "-DCMAKE_INSTALL_PREFIX=$deps" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build fparser/build --config Release
          cmake --install fparser/build --config Release

          git clone https://github.com/thliebig/CSXCAD.git CSXCAD
          if ($env:CSXCAD_REF) { git -C CSXCAD checkout $env:CSXCAD_REF }
          cmake -S CSXCAD -B CSXCAD/build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DVCPKG_TARGET_TRIPLET=$env:TRIPLET" "-DVCPKG_HOST_TRIPLET=$env:TRIPLET" -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_MANIFEST_INSTALL=OFF "-DCMAKE_INSTALL_PREFIX=$deps" "-DFPARSER_ROOT_DIR=$deps" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build CSXCAD/build --config Release
          cmake --install CSXCAD/build --config Release

          Write-Host '===== Installed fparser and CSXCAD files ====='
          Get-ChildItem -Path "$deps/include", "$deps/lib", "$deps/bin" -ErrorAction SilentlyContinue -Recurse -File | Select-Object -ExpandProperty FullName

      - name: Configure CMake
        shell: pwsh
        env:
          CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures || '75;86;89' }}
          CXXFLAGS: /FIiso646.h
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          $cfg = @(
            '-S', '.', '-B', 'build', '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=$env:TRIPLET",
            "-DVCPKG_HOST_TRIPLET=$env:TRIPLET",
            '-DVCPKG_MANIFEST_MODE=OFF',
            '-DVCPKG_MANIFEST_INSTALL=OFF',
            "-DCMAKE_INSTALL_PREFIX=$ws/dist",
            "-DFPARSER_ROOT_DIR=$ws/deps",
            "-DCSXCAD_ROOT_DIR=$ws/deps",
            '-DWITH_CUDA=ON',
            "-DCMAKE_CUDA_ARCHITECTURES=$env:CUDA_ARCHITECTURES",
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
          )
          cmake @cfg

      - name: Build openEMS
        id: build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install openEMS
        id: install
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --install build --config Release 2>&1 | Tee-Object -FilePath install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show build and install errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Write-Host '===== errors from build.log ====='
            Select-String -Path build.log -Pattern 'FAILED:|fatal error|error C\d+|: error|LNK\d+|nvcc fatal|Error \d+$' -Context 0,2 | Select-Object -First 40 | ForEach-Object { $_.ToString() }
          }
          if (Test-Path install.log) {
            Write-Host '===== tail of install.log ====='
            Get-Content install.log -Tail 40
          }

      - name: Assemble cuda-bin
        shell: pwsh
        env:
          CUDA_VERSION: ${{ inputs.cuda_version || '12.6.3' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $prefix = Join-Path $ws 'dist'
          $out = Join-Path $ws 'cuda-bin'
          $cudaBin = Join-Path $env:CUDA_PATH 'bin'
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item -LiteralPath (Join-Path $prefix 'bin\openEMS.exe') -Destination $out -Force
          Get-ChildItem -LiteralPath (Join-Path $prefix 'bin') -Filter '*.dll' -File | Copy-Item -Destination $out -Force

          $crtDir = Get-ChildItem -LiteralPath (Join-Path $env:VCToolsRedistDir 'x64') -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crtDir) { throw "Microsoft.VC*.CRT not found under $env:VCToolsRedistDir" }
          Get-ChildItem -LiteralPath $crtDir.FullName -File | Where-Object { $_.Name -like 'msvcp140*.dll' -or $_.Name -like 'vcruntime140*.dll' } | Copy-Item -Destination $out -Force
          Copy-Item -LiteralPath (Join-Path $cudaBin 'cudart64_12.dll') -Destination $out -Force

          function Get-ImportedDlls([string]$Path) {
            $text = (& dumpbin.exe /dependents $Path 2>&1 | Out-String)
            [regex]::Matches($text, '(?im)^\s+(\S+\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value }
          }
          $searchDirs = @(
            $out,
            (Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$env:TRIPLET\bin"),
            (Join-Path $ws 'deps\bin'),
            $cudaBin
          )
          $keep = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $queue.Enqueue((Join-Path $out 'openEMS.exe'))
          while ($queue.Count -gt 0) {
            $file = $queue.Dequeue()
            foreach ($dll in (Get-ImportedDlls $file)) {
              if ($keep.Contains($dll)) { continue }
              $src = $null
              foreach ($dir in $searchDirs) {
                $candidate = Join-Path $dir $dll
                if (Test-Path -LiteralPath $candidate) { $src = $candidate; break }
              }
              if (-not $src) { continue }
              [void]$keep.Add($dll)
              $dest = Join-Path $out $dll
              if (-not (Test-Path -LiteralPath $dest)) { Copy-Item -LiteralPath $src -Destination $dest -Force }
              $queue.Enqueue($dest)
            }
          }
          [void]$keep.Add('cudart64_12.dll')
          Get-ChildItem -LiteralPath $out -Filter '*.dll' -File | Where-Object { -not $keep.Contains($_.Name) -and $_.Name -notlike 'msvcp140*' -and $_.Name -notlike 'vcruntime140*' } | ForEach-Object { Write-Host "Removing unused DLL: $($_.Name)"; Remove-Item -LiteralPath $_.FullName -Force }
          Get-ChildItem -LiteralPath $out -Recurse -Filter '*.pdb' -File | Remove-Item -Force
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          @"
          openEMS with CUDA engine
          ========================
          This folder contains openEMS-CUDA built from this repository.
          Built from $env:GITHUB_REPOSITORY at commit $sha with CUDA Toolkit $env:CUDA_VERSION.
          Run: openEMS.exe <simulation.xml> --engine=cuda [--cuda-device=<n>]
          "@ | Set-Content -LiteralPath (Join-Path $out 'README_CUDA.txt') -Encoding UTF8

          Write-Host '===== cuda-bin contents ====='
          Get-ChildItem -LiteralPath $out | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Build Python wheels from this fork
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $ws = $env:GITHUB_WORKSPACE
          $prefix = Join-Path $ws 'dist'
          $deps = Join-Path $ws 'deps'
          $binding = Join-Path $ws 'binding-prefix'
          $wheelhouse = Join-Path $ws 'python-wheels'
          foreach ($folder in @('include', 'lib', 'bin')) {
            New-Item -ItemType Directory -Force -Path (Join-Path $binding $folder) | Out-Null
          }
          New-Item -ItemType Directory -Force -Path $wheelhouse | Out-Null

          # Create a single build prefix made from the exact native libraries above.
          foreach ($pair in @(
            @{ Source = (Join-Path $deps 'include'); Dest = (Join-Path $binding 'include') },
            @{ Source = (Join-Path $prefix 'include'); Dest = (Join-Path $binding 'include') },
            @{ Source = (Join-Path $deps 'lib'); Dest = (Join-Path $binding 'lib') },
            @{ Source = (Join-Path $prefix 'lib'); Dest = (Join-Path $binding 'lib') }
          )) {
            if (Test-Path -LiteralPath $pair.Source) {
              Get-ChildItem -LiteralPath $pair.Source -Force | Copy-Item -Destination $pair.Dest -Recurse -Force
            }
          }
          foreach ($sourceDir in @((Join-Path $deps 'bin'), (Join-Path $prefix 'bin'), (Join-Path $ws 'cuda-bin'))) {
            if (Test-Path -LiteralPath $sourceDir) {
              Get-ChildItem -LiteralPath $sourceDir -Filter '*.dll' -File | Copy-Item -Destination (Join-Path $binding 'bin') -Force
            }
          }

          python --version
          python -m pip install --upgrade pip setuptools wheel Cython numpy h5py
          $env:BINDING_PREFIX = $binding
          $env:CSXCAD_INSTALL_PATH = $binding
          $env:OPENEMS_INSTALL_PATH = $binding
          $env:INCLUDE = "$binding\include;$env:INCLUDE"
          $env:LIB = "$binding\lib;$env:LIB"
          $env:PATH = "$binding\bin;$env:PATH"

          # Build CSXCAD's Python binding first, then install it only into this CI Python
          # so openEMS's Cython source can resolve its package/interface files.
          Push-Location (Join-Path $ws 'CSXCAD\python')
          try {
            # MSVC does not support runtime_library_dirs (-R). DLL directories
            # are provided through PATH and os.add_dll_directory() in the import test.
            python setup.py build_ext "-I$binding\include" "-L$binding\lib" bdist_wheel --dist-dir $wheelhouse
            if ($LASTEXITCODE -ne 0) { throw 'Building the CSXCAD wheel failed' }
          } finally { Pop-Location }
          $csxWheel = @(Get-ChildItem -LiteralPath $wheelhouse -Filter 'csxcad-*-cp313-cp313-win_amd64.whl' -File)
          if ($csxWheel.Count -ne 1) {
            Get-ChildItem -LiteralPath $wheelhouse -Force | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host
            throw "Expected exactly one CSXCAD cp313 wheel; found $($csxWheel.Count)"
          }
          python -m pip install --no-deps $csxWheel[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installing the locally built CSXCAD wheel failed' }

          Push-Location (Join-Path $ws 'python')
          try {
            # MSVC does not support runtime_library_dirs (-R). DLL directories
            # are provided through PATH and os.add_dll_directory() in the import test.
            python setup.py build_ext "-I$binding\include" "-L$binding\lib" bdist_wheel --dist-dir $wheelhouse
            if ($LASTEXITCODE -ne 0) { throw 'Building the openEMS wheel from this fork failed' }
          } finally { Pop-Location }
          $openemsWheel = @(Get-ChildItem -LiteralPath $wheelhouse -Filter 'openems-*-cp313-cp313-win_amd64.whl' -File)
          if ($openemsWheel.Count -ne 1) {
            Get-ChildItem -LiteralPath $wheelhouse -Force | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host
            throw "Expected exactly one openEMS cp313 wheel built from this source; found $($openemsWheel.Count)"
          }
          if ($openemsWheel[0].Name -match 'openems-0\.37(\.|-)') {
            throw "Unexpected official openEMS 0.37 wheel found instead of the wheel built from this checkout: $($openemsWheel[0].Name)"
          }
          python -c "import os; root=os.environ['BINDING_PREFIX']; dll_root=os.add_dll_directory(root); dll_bin=os.add_dll_directory(os.path.join(root, 'bin')); import CSXCAD, openEMS; print('CSXCAD:', CSXCAD.__file__); print('openEMS:', openEMS.__file__)"
          if ($LASTEXITCODE -ne 0) { throw 'Import test failed for the fork-built CSXCAD/openEMS wheels and DLLs' }
          Write-Host '===== Python wheels built from this checkout ====='
          Get-ChildItem -LiteralPath $wheelhouse -Filter '*.whl' | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Smoke test CUDA openEMS executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'cuda-bin\openEMS.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $output = (& $exe 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $output
          Write-Host "exit code: $code"
          if ($code -eq -1073741515 -or $code -eq -1073741313 -or $code -lt -1000000000) {
            throw "openEMS.exe could not start (exit code $code): a DLL is missing or incompatible"
          }
          if ($output -notmatch '--engine=cuda') { throw 'The usage text does not contain --engine=cuda' }
          $global:LASTEXITCODE = 0

      - name: Upload cuda-bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuda-bin
          path: ${{ github.workspace }}/cuda-bin
          if-no-files-found: error

      - name: Upload fork-matched Python runtime
        uses: actions/upload-artifact@v4
        with:
          name: fork-python-runtime
          path: |
            binding-prefix/**
            python-wheels/*.whl
          if-no-files-found: error

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  package:
    needs: build
    runs-on: windows-2022
    env:
      OFFICIAL_VERSION: ${{ inputs.official_version || 'v0.37.0' }}
    steps:
      - name: Download official package for GUI and resources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $v = $env:OFFICIAL_VERSION
          $url = "https://github.com/thliebig/openEMS-Project/releases/download/$v/openEMS_x64_${v}_msvc.zip"
          Write-Host "Downloading $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile official.zip
          } catch {
            Write-Host "Download failed: $($_.Exception.Message)"
            gh release view $v --repo thliebig/openEMS-Project --json assets --jq '.assets[].name'
            throw
          }
          Expand-Archive -Path official.zip -DestinationPath pkgstage

      - name: Download CUDA binary artifact
        uses: actions/download-artifact@v4
        with:
          name: cuda-bin
          path: ${{ github.workspace }}/cuda-bin

      - name: Download fork-matched Python runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: fork-python-runtime
          path: ${{ github.workspace }}/fork-python-runtime

      - name: Add isolated CUDA runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $root = Join-Path $ws 'pkgstage\openEMS'
          if (-not (Test-Path -LiteralPath $root)) { throw 'pkgstage\openEMS not found; official ZIP layout differs from expected.' }
          $runtime = Join-Path $root 'cuda-runtime'
          $bin = Join-Path $runtime 'bin'
          $native = Join-Path $ws 'fork-python-runtime\binding-prefix'
          $wheelhouse = Join-Path $ws 'fork-python-runtime\python-wheels'
          $pythonDir = Join-Path $runtime 'python'
          New-Item -ItemType Directory -Force -Path $bin, $pythonDir | Out-Null
          Get-ChildItem -LiteralPath (Join-Path $ws 'cuda-bin') -Force | Copy-Item -Destination $bin -Recurse -Force
          Get-ChildItem -LiteralPath (Join-Path $native 'bin') -Filter '*.dll' -File | Copy-Item -Destination $runtime -Force
          Copy-Item -Path (Join-Path $wheelhouse '*.whl') -Destination $pythonDir -Force

          # Remove upstream 0.37 Python wheels/source packages from the shared Python folder.
          # The official root DLLs and GUI files remain available for AppCSXCAD; RFsim will use cuda-runtime.
          $officialPython = Join-Path $root 'python'
          if (Test-Path -LiteralPath $officialPython) {
            Get-ChildItem -LiteralPath $officialPython -Filter '*.whl' -File -ErrorAction SilentlyContinue | Remove-Item -Force
            foreach ($name in @('CSXCAD', 'openEMS')) {
              $oldPackage = Join-Path $officialPython $name
              if (Test-Path -LiteralPath $oldPackage) { Remove-Item -LiteralPath $oldPackage -Recurse -Force }
            }
          }

          $setupText = @'
          RFsim CUDA runtime setup
          =========================
          This directory contains openEMS-CUDA and Python wheels built from the same source build.
          The official package in the parent folder is retained for AppCSXCAD and support resources.

          After extracting the complete package to C:\openEMS, open CMD and run:

            py -3.13 -m venv C:\openEMS\cuda-runtime\venv
            C:\openEMS\cuda-runtime\venv\Scripts\python.exe -m pip install numpy h5py
            C:\openEMS\cuda-runtime\venv\Scripts\python.exe -m pip install --no-index --find-links C:\openEMS\cuda-runtime\python csxcad openems
            setx OPENEMS_PATH "C:\openEMS\cuda-runtime"
            setx OPENEMS_INSTALL_PATH "C:\openEMS\cuda-runtime"
            setx CSXCAD_INSTALL_PATH "C:\openEMS\cuda-runtime"
            setx RFSIM_PYTHON "C:\openEMS\cuda-runtime\venv\Scripts\python.exe"
            setx RFSIM_CUDA_EXE "C:\openEMS\cuda-runtime\bin\openEMS.exe"

          Close and restart KiCad after setting environment variables. If you extract elsewhere, edit paths above.
          '@
          $setupText | Set-Content -LiteralPath (Join-Path $runtime 'README_RFSIM.txt') -Encoding UTF8
          Write-Host '===== isolated CUDA runtime ====='
          Get-ChildItem -LiteralPath $runtime -Force | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host '===== Python wheels ====='
          Get-ChildItem -LiteralPath $pythonDir -Filter '*.whl' | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Verify package structure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'pkgstage\openEMS'
          $required = @(
            'openEMS.exe', 'openEMS.dll', 'CSXCAD.dll', 'qt.conf', 'matlab',
            'include\openEMS', 'lib\openEMS.lib',
            'cuda-runtime\CSXCAD.dll', 'cuda-runtime\openEMS.dll',
            'cuda-runtime\python\openems-*-cp313-cp313-win_amd64.whl',
            'cuda-runtime\python\csxcad-*-cp313-cp313-win_amd64.whl',
            'cuda-runtime\bin\openEMS.exe', 'cuda-runtime\bin\cudart64_12.dll',
            'cuda-runtime\README_RFSIM.txt'
          )
          $missing = @($required | Where-Object { -not (Test-Path -Path (Join-Path $root $_)) })
          $venv = @(Get-ChildItem -LiteralPath $root -Recurse -Directory -Filter 'venv' -ErrorAction SilentlyContinue)
          $forbidden = @()
          if (Test-Path -LiteralPath (Join-Path $root 'hdf5.dll')) { $forbidden += 'unexpected hdf5.dll in official package root' }
          if ($venv.Count -gt 0) { $forbidden += ('venv folder should not be included in artifact: ' + (($venv | ForEach-Object { $_.FullName }) -join ', ')) }
          Write-Host '===== package root ====='
          Get-ChildItem -LiteralPath $root | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host
          if ($missing.Count -gt 0) { Write-Host 'MISSING:'; $missing | ForEach-Object { Write-Host "  $_" } }
          if ($forbidden.Count -gt 0) { Write-Host 'FORBIDDEN:'; $forbidden | ForEach-Object { Write-Host "  $_" } }
          if ($missing.Count -gt 0 -or $forbidden.Count -gt 0) { throw 'Package structure check failed' }

      - name: Upload openEMS-Windows-CUDA
        uses: actions/upload-artifact@v4
        with:
          name: openEMS-Windows-CUDA
          path: ${{ github.workspace }}/pkgstage/
          if-no-files-found: error
